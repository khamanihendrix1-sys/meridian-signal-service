version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meridian
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'

  api:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://meridian:password@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: secret-key
    ports:
      - '8000:8000'
    command: uvicorn meridian.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres-data:
