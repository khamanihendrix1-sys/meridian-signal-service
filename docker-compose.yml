version: '3.9'

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://meridian:password@postgres:5432/meridian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-signing-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIGNAL_SCHEDULER_CONCURRENCY: ${SIGNAL_SCHEDULER_CONCURRENCY:-3}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    ports:
      - '8000:8000'
    command: uvicorn meridian.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://meridian:password@postgres:5432/meridian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-signing-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIGNAL_SCHEDULER_CONCURRENCY: ${SIGNAL_SCHEDULER_CONCURRENCY:-3}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    command: meridian-worker

  scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://meridian:password@postgres:5432/meridian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-signing-key}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIGNAL_SCHEDULER_CONCURRENCY: ${SIGNAL_SCHEDULER_CONCURRENCY:-3}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    command: meridian-scheduler

volumes:
  postgres-data:
