name: Deploy to Fly.io

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

env:
  FLY_REGION: iad
  PROD_APP: meridian-signal-service

jobs:
  preview-deploy:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Compute preview app name
        run: echo "PREVIEW_APP=meridian-signal-pr-${{ github.event.number }}" >> $GITHUB_ENV

      - name: Ensure preview app exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl apps show "$PREVIEW_APP" 2>/dev/null || flyctl apps create "$PREVIEW_APP" --org personal

      - name: Deploy preview app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --remote-only \
            --app "$PREVIEW_APP" \
            --region "$FLY_REGION"

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const app = `meridian-signal-pr-${context.payload.pull_request.number}`;
            const body = `✅ Preview deployed: https://${app}.fly.dev`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

  preview-destroy:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy preview app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          APP="meridian-signal-pr-${{ github.event.number }}"
          flyctl apps destroy "$APP" --yes 2>/dev/null || true

  production-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy production app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy \
            --remote-only \
            --app "$PROD_APP" \
            --region "$FLY_REGION"
