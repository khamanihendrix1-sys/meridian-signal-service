[project]
name = "meridian-signal-service"
version = "0.1.0"
description = "Meridian Signals microservice backend for Wix integration."
readme = "README.md"
authors = ["Meridian Software <hello@meridiansoftware.com>"]
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

[project.dependencies]
fastapi = "^0.111.1"
"uvicorn[standard]" = "^0.23.2"
pydantic = "^2.8.0"
pydantic-settings = "^2.5.2"
"sqlalchemy[asyncio]" = "^2.0.45"
asyncpg = "^1.0.0"
alembic = "^1.12.0"
redis = "^4.9.0"
"celery[redis]" = "^5.3.1"
apscheduler = "^3.11.0"
httpx = "^0.27.0"
reportlab = "^4.0.0"
structlog = "^24.1.0"
opentelemetry-api = "^1.18.0"
opentelemetry-instrumentation-fastapi = "^0.34b0"
prometheus-client = "^0.17.0"
sentry-sdk = "^1.29.0"
pyjwt = "^2.9.0"
python-multipart = "^0.0.6"
geoalchemy2 = "^0.13.0"
shapely = "^2.1.1"
python-dotenv = "^1.0.0"

[project.optional-dependencies]
dev = [
    "ipython",
    "watchdog",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "pytest-cov",
    "factory_boy",
    "hypothesis",
]
lint = [
    "ruff",
    "black",
    "mypy",
]
prod = []

[project.scripts]
meridian-api = "meridian.main:run"
meridian-worker = "meridian.integrations.celery_app:run_worker"
meridian-scheduler = "meridian.integrations.scheduler:run_scheduler"
meridian-cli = "meridian.cli:main"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
ignore = ["E501"]

[tool.mypy]
python_version = 3.12
strict = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers --strict-config --cov=meridian --cov-report=term-missing"
testpaths = ["tests"]
