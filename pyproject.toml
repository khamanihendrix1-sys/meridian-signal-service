[tool.poetry]
name = "meridian-signal-service"
version = "0.1.0"
description = "Meridian Signals microservice backend."
readme = "README.md"
authors = ["Meridian Software <hello@meridiansoftware.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.138.1"
uvicorn = {version = "^0.23.2", extras = ["standard"]}
pydantic = "^2.8.0"
pydantic-settings = "^2.5.2"
sqlalchemy = {version = "^2.0.45", extras = ["asyncio"]}
asyncpg = "^0.29.0"
alembic = "^1.12.0"
redis = "^4.6.0"
celery = {version = "^5.3.1", extras = ["redis"]}
apscheduler = "^3.11.0"
httpx = "^0.28.0"
reportlab = "^4.0.0"
structlog = "^24.1.0"
opentelemetry-api = "^1.18.0"
opentelemetry-instrumentation-fastapi = ">=0.41b0"
prometheus-client = "^0.17.0"
sentry-sdk = "^1.29.0"
pyjwt = "^2.9.0"
python-multipart = ">=0.0.31"
geoalchemy2 = "^0.13.0"
shapely = "^2.1.1"
python-dotenv = "^1.0.0"
PyYAML = "^6.0.2"

[tool.poetry.group.dev.dependencies]
ipython = "*"
watchdog = "*"

[tool.poetry.group.test.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-httpx = "*"
pytest-cov = "*"
factory_boy = "*"
hypothesis = "*"

[tool.poetry.group.lint.dependencies]
ruff = "*"
black = "*"
mypy = "*"
types-PyYAML = "*"

[tool.poetry.scripts]
meridian-api = "meridian.main:run"
meridian-worker = "meridian.integrations.celery_app:run_worker"
meridian-scheduler = "meridian.integrations.scheduler:run_scheduler"
meridian-cli = "meridian.cli:main"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
lint.ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
check_untyped_defs = true
warn_unused_ignores = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "geoalchemy2",
  "geoalchemy2.*",
  "shapely",
  "shapely.*",
  "celery",
  "redis",
  "redis.*",
  "apscheduler.*",
  "psutil",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers --strict-config --cov=meridian --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "benchmark: performance benchmark tests",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
