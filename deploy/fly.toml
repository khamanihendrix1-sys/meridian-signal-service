app = "meridian-signal-service"

[env]
  APP_ENV = "production"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"
    # Internal health checks run inside Fly's network before edge TLS termination.
    protocol = "http"

[experimental]
  auto_rollback = true
