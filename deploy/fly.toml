app = "meridian-signal-service"

[env]
  APP_ENV = "production"
  DATABASE_URL = "{{DATABASE_URL}}"
  REDIS_URL = "{{REDIS_URL}}"
  JWT_SIGNING_KEY = "{{JWT_SIGNING_KEY}}"
  WIX_HMAC_SECRET = "{{WIX_HMAC_SECRET}}"

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "get"
    path = "/healthz"
    protocol = "http"
    tls_skip_verify = false

[experimental]
  auto_rollback = true
