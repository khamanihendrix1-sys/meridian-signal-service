app = "meridian-signal-service"

[build]
  image = ""

[env]
  DATABASE_URL = "{{DATABASE_URL}}"
  REDIS_URL = "{{REDIS_URL}}"
  JWT_SIGNING_KEY = "{{JWT_SIGNING_KEY}}"
  WIX_HMAC_SECRET = "{{WIX_HMAC_SECRET}}"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  ports = [{port = 8000, handlers = ["http"]}]

[experimental]
  auto_rollback = true
